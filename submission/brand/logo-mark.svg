<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ReadyCounter mark: an itemised receipt tape">
  <title>ReadyCounter</title>
  <rect width="256" height="256" fill="#000000"/>
  <!-- the tape: ReadyCounter's signature device, torn at the foot -->
  <path fill="#f7f7f5" d="M64 40 h128 v150
    l-10.67 10 -10.66 -10 -10.67 10 -10.66 -10 -10.67 10 -10.66 -10
    -10.67 10 -10.66 -10 -10.67 10 -10.66 -10 -10.67 10 -10.66 -10 Z"/>
  <!-- itemised lines; the last one is the score, and it is the only solid bar -->
  <g fill="#000000">
    <rect x="84" y="72"  width="88" height="6"/>
    <rect x="84" y="94"  width="60" height="6"/>
    <rect x="84" y="116" width="74" height="6"/>
    <rect x="84" y="138" width="46" height="6"/>
  </g>
  <rect x="84" y="160" width="88" height="18" fill="#bf2b1a"/>
</svg>
